name: Build and Deploy to GitHub Pages

# Das Skript läuft jedes Mal, wenn du auf "main" pushst
on:
  push:
    branches: ["main"]

# Notwendige Berechtigungen, damit die Action auf Pages schreiben darf
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
      
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build-Skript ausführen
        run: python build.py

      - name: Ergebnisse als Artifact hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Nur der generierte Ordner wird veröffentlicht!

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
