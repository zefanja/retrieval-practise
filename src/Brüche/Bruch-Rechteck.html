<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bruch-Rechteck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: Mathe-Heft-Kästchenpapier; links Bedienfeld mit zwei Bruchkarten, rechts großes Rechteckmodell. Blau = Füller, Rot = Korrekturstift, Violett = Überlappung. */
:root{
  --paper:#f8fafc; --grid:#e3eaf2; --surface:#ffffff; --line:#cdd7e3;
  --ink:#172636; --muted:#5a6b7d;
  --blue:#1d5fc4; --blue-tint:rgba(29,95,196,.22); --blue-soft:#e6efff;
  --red:#cf3426; --red-soft:#fdeceA;
  --violet:#6a3db3; --violet-fill:rgba(106,61,179,.62);
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f151c; --grid:#18222d; --surface:#151e28; --line:#2a3746;
  --ink:#e5edf5; --muted:#93a4b6;
  --blue:#5c9cff; --blue-tint:rgba(92,156,255,.26); --blue-soft:#1a2a44;
  --red:#ff6e60; --red-soft:#3a1d1b;
  --violet:#b48dff; --violet-fill:rgba(160,120,255,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f151c; --grid:#18222d; --surface:#151e28; --line:#2a3746;
  --ink:#e5edf5; --muted:#93a4b6;
  --blue:#5c9cff; --blue-tint:rgba(92,156,255,.26); --blue-soft:#1a2a44;
  --red:#ff6e60; --red-soft:#3a1d1b;
  --violet:#b48dff; --violet-fill:rgba(160,120,255,.6);
  color-scheme:dark}

html,body{min-height:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;
  color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 32px;
}
.app{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:350px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,3vw,2.2rem);margin:0;letter-spacing:-.01em}
.equation{font-family:var(--display);font-weight:600;font-size:clamp(1.6rem,3.4vw,2.6rem);display:flex;align-items:center;gap:.35em;flex-wrap:wrap}
.equation .op{color:var(--muted)}

/* Brüche */
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1;font-variant-numeric:tabular-nums}
.frac .n,.frac .d{padding:0 .12em}
.frac .bar{align-self:stretch;height:.08em;min-height:2px;background:currentColor;margin:.08em 0;border-radius:2px}
.c-blue{color:var(--blue)} .c-red{color:var(--red)} .c-violet{color:var(--violet)}
.q{color:var(--muted)}

.panel{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.card.a{border-top:5px solid var(--blue)} .card.b{border-top:5px solid var(--red)}
.card h2{margin:0;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.editor{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.bigfrac{font-family:var(--display);font-weight:800;font-size:3.4rem;min-width:2.2ch;text-align:center}
.steppers{display:flex;flex-direction:column;gap:10px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper span{font-size:.85rem;color:var(--muted);width:4.5em}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.pm{width:52px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:1.6rem;font-weight:700;line-height:1}
.pm:active{transform:scale(.95)}
.pm:disabled{opacity:.35;cursor:default}
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:6px 0;font-size:1rem;font-weight:700;display:flex;justify-content:center;min-height:52px;align-items:center}
.chip .frac{font-size:1.05rem}
.card.a .chip.on{background:var(--blue);border-color:var(--blue);color:var(--surface)}
.card.b .chip.on{background:var(--red);border-color:var(--red);color:var(--surface)}

.tools{display:flex;gap:8px;flex-wrap:wrap}
.tool{flex:1 1 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-weight:700;min-height:46px}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* Modell */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.seg{flex:1 1 140px;display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;text-align:left;min-height:56px}
.seg b{font-family:var(--display);font-size:1.4rem;width:1.3em;height:1.3em;display:grid;place-items:center;border-radius:50%;background:var(--line);color:var(--ink);flex:none}
.seg[aria-current="step"]{border-color:var(--ink)}
.seg[aria-current="step"] b{background:var(--ink);color:var(--surface)}
.seg.done b{background:var(--muted);color:var(--surface)}
.seg span{font-weight:700;font-size:.98rem}
.next{flex:0 0 auto;background:var(--violet);color:#fff;border:0;border-radius:12px;padding:0 22px;font-weight:700;font-size:1.05rem;min-height:56px}
.svgwrap{width:100%;overflow:hidden}
svg{display:block;width:100%;height:auto;max-height:68vh}
.explain{font-size:1.15rem;min-height:3.2em;display:flex;align-items:center;gap:.4em;flex-wrap:wrap;margin:0}
.explain .frac{font-size:1.05em;font-weight:700;vertical-align:middle}

/* SVG-Klassen */
.s-whole{fill:var(--surface)}
.s-blue{fill:var(--blue-tint)}
.s-hatch-line{stroke:var(--red);stroke-width:3}
.s-overlap{fill:var(--violet-fill)}
.s-la{stroke:var(--blue);stroke-width:2.5}
.s-lb{stroke:var(--red);stroke-width:2.5}
.s-ext{stroke:var(--muted);stroke-width:2;stroke-dasharray:7 6}
.s-border{fill:none;stroke:var(--ink);stroke-width:4}
.s-brace-a{stroke:var(--blue);stroke-width:3;fill:none}
.s-brace-b{stroke:var(--red);stroke-width:3;fill:none}
.t-a{fill:var(--blue)} .t-b{fill:var(--red)} .t-c{fill:#fff}
.t-m{fill:var(--muted)}
svg text{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
.in{animation:fade .5s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.in{animation:none}}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.legend i{display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:-3px;margin-right:6px}
</style>

<div class="app">
  <header>
    <h1>Anteil vom Anteil</h1>
    <div class="equation" id="eq" aria-live="polite"></div>
  </header>

  <section class="panel" aria-label="Brüche wählen">
    <div class="card a" id="cardA"></div>
    <div class="card b" id="cardB"></div>
    <div class="tools">
      <button class="tool" id="swap">⇄ Tauschen</button>
      <button class="tool" id="rand">Zufallsaufgabe</button>
      <button class="tool" id="nums" aria-pressed="false">Kästchen zählen</button>
    </div>
  </section>

  <section class="stage" aria-label="Rechteckmodell">
    <div class="steps" id="steps"></div>
    <div class="svgwrap"><svg id="model" viewBox="-110 -96 760 556" role="img" aria-label="Rechteckmodell"></svg></div>
    <p class="explain" id="explain"></p>
    <div class="legend">
      <span><i style="background:var(--blue-tint);border:2px solid var(--blue)"></i>1. Bruch</span>
      <span><i style="background:repeating-linear-gradient(45deg,var(--red) 0 3px,transparent 3px 8px);border:2px solid var(--red)"></i>davon (2. Bruch)</span>
      <span><i style="background:var(--violet-fill)"></i>Ergebnis</span>
    </div>
  </section>
</div>

<script>
const MAXD = 12;
const PRESETS = [[1,2],[1,3],[2,3],[1,4],[3,4],[1,5],[2,5],[3,5],[4,5],[1,6],[5,6],[3,8]];
const state = { a:{n:3,d:4}, b:{n:2,d:3}, step:1, nums:false };
let lastStep = 0;

const $ = id => document.getElementById(id);
const gcd = (x,y) => y ? gcd(y, x%y) : x;
const fr = (n,d,cls='') => `<span class="frac ${cls}"><span class="n">${n}</span><span class="bar"></span><span class="d">${d}</span></span>`;

function cardHTML(key){
  const f = state[key], blue = key==='a';
  const title = blue ? '1. Bruch · blau' : '2. Bruch · rot („davon“)';
  return `<h2>${title}</h2>
  <div class="editor">
    <div class="bigfrac ${blue?'c-blue':'c-red'}">${fr(f.n,f.d)}</div>
    <div class="steppers">
      <div class="stepper"><span>Zähler</span>
        <button class="pm" data-k="${key}" data-p="n" data-v="-1" aria-label="Zähler verkleinern" ${f.n<=1?'disabled':''}>−</button>
        <button class="pm" data-k="${key}" data-p="n" data-v="1" aria-label="Zähler vergrößern" ${f.n>=f.d?'disabled':''}>+</button></div>
      <div class="stepper"><span>Nenner</span>
        <button class="pm" data-k="${key}" data-p="d" data-v="-1" aria-label="Nenner verkleinern" ${f.d<=1?'disabled':''}>−</button>
        <button class="pm" data-k="${key}" data-p="d" data-v="1" aria-label="Nenner vergrößern" ${f.d>=MAXD?'disabled':''}>+</button></div>
    </div>
  </div>
  <div class="chips">${PRESETS.map(([n,d])=>`<button class="chip ${f.n===n&&f.d===d?'on':''}" data-k="${key}" data-set="${n}/${d}" aria-label="${n} ${d}tel">${fr(n,d)}</button>`).join('')}</div>`;
}

function stepsHTML(){
  const labels = ['1. Bruch färben','davon nehmen','Ergebnis ablesen'];
  return labels.map((l,i)=>{
    const s=i+1;
    return `<button class="seg ${s<state.step?'done':''}" data-step="${s}" ${s===state.step?'aria-current="step"':''}><b>${s}</b><span>${l}</span></button>`;
  }).join('') + `<button class="next" id="next">${state.step<3?'Weiter →':'Neu starten'}</button>`;
}

function svgFrac(x,y,n,d,cls,size=34){
  const w = Math.max(String(n).length,String(d).length)*size*0.62+10;
  return `<g class="${cls}">
    <text x="${x}" y="${y-6}" text-anchor="middle" font-size="${size}">${n}</text>
    <rect x="${x-w/2}" y="${y}" width="${w}" height="4" rx="2"/>
    <text x="${x}" y="${y+4+size*0.86}" text-anchor="middle" font-size="${size}">${d}</text></g>`;
}

function renderSVG(){
  const W=600,H=400, {a,b,step}=state;
  const cw=W/a.d, rh=H/b.d, bw=a.n*cw, bh=b.n*rh;
  const anim = s => (s===step && step!==lastStep) ? 'in' : '';
  let o = `<defs><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="14" class="s-hatch-line"/></pattern></defs>`;
  o += `<rect x="0" y="0" width="${W}" height="${H}" class="s-whole"/>`;
  o += `<rect x="0" y="0" width="${bw}" height="${H}" class="s-blue ${anim(1)}"/>`;
  if(step>=2) o += `<rect x="0" y="0" width="${bw}" height="${bh}" fill="url(#hatch)" class="${anim(2)}"/>`;
  if(step>=3) o += `<rect x="0" y="0" width="${bw}" height="${bh}" class="s-overlap ${anim(3)}"/>`;
  for(let i=1;i<a.d;i++) o += `<line x1="${i*cw}" y1="0" x2="${i*cw}" y2="${H}" class="s-la"/>`;
  if(step>=2){
    for(let j=1;j<b.d;j++){
      o += `<line x1="0" y1="${j*rh}" x2="${bw}" y2="${j*rh}" class="s-lb ${anim(2)}"/>`;
      if(step>=3 && bw<W) o += `<line x1="${bw}" y1="${j*rh}" x2="${W}" y2="${j*rh}" class="s-ext ${anim(3)}"/>`;
    }
  }
  if(step>=3 && state.nums){
    const fs = Math.min(30, Math.min(cw,rh)*0.42);
    let k=0;
    for(let j=0;j<b.n;j++) for(let i=0;i<a.n;i++){ k++;
      o += `<text x="${i*cw+cw/2}" y="${j*rh+rh/2+fs*0.35}" text-anchor="middle" font-size="${fs}" class="t-c in">${k}</text>`; }
  }
  o += `<rect x="0" y="0" width="${W}" height="${H}" class="s-border"/>`;
  // obere Klammer: 1. Bruch
  o += `<path d="M0,-10 v-10 H${bw} v10" class="s-brace-a"/>`;
  o += svgFrac(bw/2,-62,a.n,a.d,'t-a',30).replace('<g ','<g transform="translate(0,0)" ');
  // linke Klammer: davon
  if(step>=2){
    o += `<path d="M-10,0 h-10 V${bh} h10" class="s-brace-b ${anim(2)}"/>`;
    o += `<g class="${anim(2)}">${svgFrac(-62,bh/2-14,b.n,b.d,'t-b',30)}</g>`;
  }
  // untere Beschriftung
  o += `<text x="${W/2}" y="${H+44}" text-anchor="middle" font-size="22" class="t-m">1 Ganzes${step>=3?` = ${a.d*b.d} gleich große Teile`:''}</text>`;
  $('model').innerHTML = o;
}

function render(){
  const {a,b,step}=state;
  $('cardA').innerHTML = cardHTML('a');
  $('cardB').innerHTML = cardHTML('b');
  $('steps').innerHTML = stepsHTML();
  $('nums').setAttribute('aria-pressed', state.nums);

  const pn=a.n*b.n, pd=a.d*b.d, g=gcd(pn,pd);
  let rhs = step>=3 ? fr(`${a.n}·${b.n}`,`${a.d}·${b.d}`) + `<span class="op">=</span>` + fr(pn,pd,'c-violet') +
    (g>1 ? `<span class="op">=</span>` + fr(pn/g,pd/g,'c-violet') : '') : `<span class="q">?</span>`;
  $('eq').innerHTML = fr(a.n,a.d,'c-blue') + `<span class="op">·</span>` + fr(b.n,b.d,'c-red') + `<span class="op">=</span>` + rhs;

  const A=fr(a.n,a.d,'c-blue'), B=fr(b.n,b.d,'c-red');
  const txt = [
    `Das Rechteck ist das Ganze. Wir teilen es in ${a.d} Streifen und färben ${A} blau.`,
    `Vom blauen Teil nehmen wir ${B}: Wir teilen ihn in ${b.d} Teile und schraffieren ${b.n} davon rot.`,
    `Linien verlängern: Das Ganze hat ${a.d}·${b.d} = ${pd} Teile, ${a.n}·${b.n} = ${pn} davon sind violett. ${B} von ${A} = ${fr(pn,pd,'c-violet')}${g>1?' = '+fr(pn/g,pd/g,'c-violet'):''}.`
  ];
  $('explain').innerHTML = txt[step-1];
  renderSVG();
  lastStep = step;
}

document.addEventListener('click', e=>{
  const t = e.target.closest('button'); if(!t) return;
  if(t.dataset.p){
    const f = state[t.dataset.k], v=+t.dataset.v;
    if(t.dataset.p==='n') f.n = Math.min(f.d, Math.max(1, f.n+v));
    else { f.d = Math.min(MAXD, Math.max(1, f.d+v)); f.n = Math.min(f.n, f.d); }
    render(); return;
  }
  if(t.dataset.set){ const [n,d]=t.dataset.set.split('/').map(Number); state[t.dataset.k]={n,d}; render(); return; }
  if(t.dataset.step){ state.step=+t.dataset.step; render(); return; }
  if(t.id==='next'){ state.step = state.step<3 ? state.step+1 : 1; render(); return; }
  if(t.id==='swap'){ [state.a,state.b]=[state.b,state.a]; state.step=1; lastStep=0; render(); return; }
  if(t.id==='rand'){
    const pick=()=>{const d=2+Math.floor(Math.random()*7);return {n:1+Math.floor(Math.random()*(d-1)),d};};
    state.a=pick(); state.b=pick(); state.step=1; lastStep=0; render(); return;
  }
  if(t.id==='nums'){ state.nums=!state.nums; render(); return; }
});
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' '&&e.target===document.body){ e.preventDefault(); state.step=Math.min(3,state.step+1); render(); }
  if(e.key==='ArrowLeft'){ state.step=Math.max(1,state.step-1); render(); }
});
render();
</script>

</body></html>
