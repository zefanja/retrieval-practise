<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geo-Jeopardy · Klasse 6</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --navy:#0a1628;
  --cell:#1a3a6b;
  --cell-h:#1d4595;
  --cell-u:#0c1622;
  --cat:#0e50b0;
  --cat-b:#4a9fe8;
  --gold:#ffd700;
  --modal:#071426;
}

html,body{height:100%;background:var(--navy);color:#fff;font-family:'Oswald',sans-serif;overflow:hidden}

#app{height:100vh;display:flex;flex-direction:column;padding:10px;gap:8px}

/* ── SCOREBAR ── */
#bar{display:flex;gap:10px;height:72px;flex-shrink:0}

.sc{flex:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sl{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:3px}
.sp{font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--gold);line-height:1}

#mid{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:160px;gap:4px}
#gtitle{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--gold);letter-spacing:5px;text-shadow:0 0 18px rgba(255,215,0,.35)}
#gsub{font-size:11px;color:#90caf9;letter-spacing:2px;text-transform:uppercase}
#rbtn{margin-top:3px;background:transparent;border:1px solid #2a5298;color:#90caf9;padding:3px 12px;font-size:11px;border-radius:4px;cursor:pointer;font-family:'Oswald',sans-serif;letter-spacing:1px;transition:background .15s,color .15s}
#rbtn:hover{background:#1a3a6b;color:var(--gold)}
#ubtn{background:transparent;border:1px solid #2a5298;color:#90caf9;padding:3px 12px;font-size:11px;border-radius:4px;font-family:'Oswald',sans-serif;letter-spacing:1px;transition:background .15s,color .15s,opacity .2s;opacity:.32;cursor:default}
#ubtn:not([disabled]){opacity:1;cursor:pointer}
#ubtn:not([disabled]):hover{background:#1a3a6b;color:var(--gold)}

/* ── BOARD ── */
#board{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:56px repeat(10,1fr);
  gap:5px;
  flex:1;
  min-height:0;
}

.ch{
  background:var(--cat);border:2px solid var(--cat-b);border-radius:6px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:'Oswald',sans-serif;font-weight:600;font-size:11.5px;
  letter-spacing:.5px;text-transform:uppercase;line-height:1.3;
  padding:3px 5px;color:#fff;
}

.qc{
  background:var(--cell);border:2px solid #2a5298;color:var(--gold);
  border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:clamp(14px,2vw,22px);
  letter-spacing:1px;cursor:pointer;user-select:none;
  transition:background .12s,transform .1s,box-shadow .12s;
}
.qc:hover{background:var(--cell-h);transform:scale(1.04);box-shadow:0 0 14px rgba(255,215,0,.22)}
.qc.used{background:var(--cell-u);border-color:#111d2a;color:transparent;cursor:default;pointer-events:none;transform:none!important;box-shadow:none!important}

/* ── OVERLAY ── */
#ov{
  position:fixed;inset:0;background:rgba(0,0,0,.9);
  display:none;align-items:center;justify-content:center;
  z-index:200;padding:20px;backdrop-filter:blur(3px);
}
#ov.on{display:flex;animation:fIn .2s ease}
@keyframes fIn{from{opacity:0}to{opacity:1}}

#modal{
  background:var(--modal);border:2px solid var(--gold);border-radius:14px;
  padding:32px 36px;max-width:720px;width:100%;text-align:center;
  animation:sUp .22s ease;
  box-shadow:0 0 50px rgba(255,215,0,.12);
}
@keyframes sUp{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}

.pts{
  background:var(--gold);color:#071426;font-family:'Bebas Neue',sans-serif;
  font-size:22px;letter-spacing:3px;border-radius:6px;
  display:inline-block;padding:4px 22px;margin-bottom:10px;
}
.mcat{font-size:11px;color:#90caf9;letter-spacing:2px;text-transform:uppercase;margin-bottom:18px}
.mqt{font-family:'Playfair Display',serif;font-size:22px;line-height:1.65;color:#fff;margin-bottom:26px}
.mans{
  background:#071f10;border:1px solid #43a047;border-radius:8px;
  padding:16px 20px;margin-bottom:24px;
  font-family:'Playfair Display',serif;font-size:17px;
  color:#a5d6a7;line-height:1.6;text-align:left;
  animation:fIn .3s ease;
}
.brow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.jb{
  border:none;cursor:pointer;font-family:'Oswald',sans-serif;
  font-weight:500;font-size:15px;letter-spacing:1px;
  border-radius:8px;padding:12px 22px;
  transition:opacity .12s,transform .1s;
}
.jb:hover{opacity:.84;transform:scale(1.04)}
.jb:active{transform:scale(.97)}
.jbr{background:#1055b5;color:#fff}
.jb1{background:#8b1010;color:#fff}
.jb2{background:#125212;color:#fff}
.jbs{background:#253545;color:#90a4ae}

/* score flash */
@keyframes ptFlash{0%,100%{transform:scale(1)}40%{transform:scale(1.25)}}
.flash .sp{animation:ptFlash .4s ease}
</style>
</head>
<body>

<div id="app">
  <div id="bar">
    <div class="sc" id="c1" style="background:#3a0000;border:2px solid #e53935">
      <span class="sl" style="color:#ffcdd2">Team 1</span>
      <span class="sp" id="s1">0</span>
    </div>
    <div id="mid">
      <div id="gtitle">Geo-Jeopardy</div>
      <div id="gsub">Geographie · Klasse 6</div>
      <button id="rbtn">↺ Neu starten</button>
      <button id="ubtn" disabled>↩ Rückgängig</button>
    </div>
    <div class="sc" id="c2" style="background:#002500;border:2px solid #43a047">
      <span class="sl" style="color:#c8e6c9">Team 2</span>
      <span class="sp" id="s2">0</span>
    </div>
  </div>
  <div id="board"></div>
</div>

<div id="ov"><div id="modal"></div></div>

<script>
const C=[
  {n:"Europa im Überblick",q:[
    [100,"Auf welchem Kontinent liegt Deutschland?","Europa"],
    [200,"Nenne die drei Großlandschaften Europas.","Tiefland, Mittelgebirge, Hochgebirge"],
    [300,"Welcher Ozean liegt westlich von Europa?","Atlantischer Ozean"],
    [400,"Welches ist die größte Halbinsel im Südwesten Europas?","Iberische Halbinsel"],
    [500,"Was beschreibt der Begriff 'Bevölkerungsdichte'?","Anzahl der Einwohner je Quadratkilometer"],
    [600,"Wie heißt der längste Fluss Europas?","Wolga"],
    [700,"Nenne drei Sprachgruppen in Europa.","Romanisch, Germanisch, Slawisch"],
    [800,"Was ist die Europäische Union?","Ein politischer und wirtschaftlicher Zusammenschluss europäischer Staaten"],
    [900,"Welches Gebirge bildet die natürliche Grenze zwischen Europa und Asien?","Uralgebirge"],
    [1000,"Warum ist die Bevölkerung in Europa ungleich verteilt? Nenne zwei Ursachen.","Unterschiedliche Naturräume (Klima, Boden) und unterschiedliche wirtschaftliche Entwicklung"],
  ]},
  {n:"Klima & Vegetation",q:[
    [100,"Wie nennt man es, wenn die Sonne im Sommer nicht untergeht?","Polartag"],
    [200,"In welcher Beleuchtungszone liegt der Großteil Europas?","Gemäßigte Zone"],
    [300,"Was zeigt ein Klimadiagramm?","Den Jahresgang von Temperatur und Niederschlag eines Ortes"],
    [400,"Was bedeutet 'humid'?","Feucht: Niederschlag übersteigt die Verdunstung"],
    [500,"Welche Vegetationszone findet man im äußersten Norden Europas?","Tundra"],
    [600,"Welche Meeresströmung sorgt für das milde Klima in Westeuropa?","Golfstrom"],
    [700,"Was ist der Boreale Nadelwald (Taiga)?","Nadelwaldgürtel aus Fichte, Kiefer, Lärche – nördlich der gemäßigten Zone"],
    [800,"Was sind Hartlaubgewächse und wie sind sie angepasst?","Pflanzen mit harten Blättern im Mittelmeerraum – angepasst an Sommertrockenheit"],
    [900,"Warum wechseln die Vegetationszonen in Europa von Nord nach Süd?","Zunehmende Sonneneinstrahlung → höhere Temperaturen und veränderte Niederschlagsverteilung"],
    [1000,"Unterschied zwischen humidem und aridem Klima – Bedeutung für die Vegetation?","Humid: Niederschlag > Verdunstung → üppig; Arid: Verdunstung > Niederschlag → Trockenvegetation"],
  ]},
  {n:"Norden Europas",q:[
    [100,"Wie heißt die Hauptstadt Norwegens?","Oslo"],
    [200,"Nenne die drei baltischen Staaten.","Estland, Lettland, Litauen"],
    [300,"Was ist ein Fjord?","Langer Meeresarm zwischen Steilhängen – entstanden durch Gletschererosion"],
    [400,"Was ist Inlandeis?","Flächenhaft ausgedehnter Gletscher, der große Landgebiete bedeckt"],
    [500,"Was ist eine Schäre?","Kleine, flache Felsinsel vor der skandinavischen Küste (glazial abgehobelt)"],
    [600,"Was ist ein Fjell?","Flaches, vom Inlandeis abgehobeltes Hochplateau in Skandinavien"],
    [700,"Was ist Löss und wie entsteht er?","Feinkörniges Sediment, das Wind am Rand eiszeitlicher Landschaften ablagerte"],
    [800,"Erkläre den Begriff 'Glaziale Serie'.","Typische Abfolge: Endmoräne → Sander → Zungenbecken; durch Gletscher-Vor- und Rückzug entstanden"],
    [900,"Welche Bedeutung hat Forstwirtschaft für Skandinavien?","Holz, Papier, Zellstoff = wichtige Exportgüter; Waldressourcen bilden die wirtschaftliche Grundlage"],
    [1000,"Konflikte bei Waldnutzung in Skandinavien? Was bedeutet Nachhaltigkeit?","Wirtschaft vs. Ökologie (Artenschutz); Nachhaltigkeit: nur so viel einschlagen, wie nachwächst"],
  ]},
  {n:"Atlantik bis Ural",q:[
    [100,"Wie heißt die Hauptstadt Frankreichs?","Paris"],
    [200,"Wie heißt die Hauptstadt Russlands?","Moskau"],
    [300,"Wie verändert sich das Klima in Europa von West nach Ost?","Kontinentaler: Sommer heißer, Winter kälter, Niederschläge nehmen ab"],
    [400,"Was sind Steppen und wo findet man sie in Europa?","Trockene Graslandschaften – vor allem in Osteuropa (Ukraine, Südrussland)"],
    [500,"Was ist ein 'altindustrialisierter Raum'?","Region, die ihren Aufstieg der Schwerindustrie verdankt und im Strukturwandel steckt"],
    [600,"Nenne zwei altindustrialisierte Räume in Europa.","Mittelengland, Oberschlesien (auch: Elsass-Lothringen)"],
    [700,"Was ist das Zuidersee-Projekt in den Niederlanden?","Landgewinnungsmaßnahme: Zuidersee eingedeicht und trockengelegt (heute: IJsselmeer)"],
    [800,"Was ist der Deltaplan der Niederlande?","Hochwasserschutzprogramm nach Flutkatastrophe 1953 – Flussmündungen durch Dämme gesichert"],
    [900,"Was ist 'Strukturwandel'? Erkläre am Beispiel Mittelenglands.","Rückgang von Kohle und Stahl; Übergang zu Dienstleistungen und moderner Industrie"],
    [1000,"Interessenkonflikte beim Küstenschutz in den Niederlanden? Kompromisse?","Hochwasserschutz vs. Naturschutz; offene Sturmflutsperren ermöglichen ökologischen Durchfluss"],
  ]},
  {n:"Alpenraum",q:[
    [100,"In welchem Gebirge liegt der Mont Blanc?","In den Alpen"],
    [200,"Nenne zwei Länder, die überwiegend in den Alpen liegen.","Schweiz, Österreich (auch: Liechtenstein)"],
    [300,"Was ist die Höhenstufung der Vegetation?","Abfolge mit Höhe: Laubwald → Nadelwald → Almwiese → Fels/Eis"],
    [400,"Was ist ein Gletscher?","Große Eismasse, die sich durch Schneeverdichtung bildet und talwärts fließt"],
    [500,"Was ist Massentourismus?","Tourismus mit sehr großer Besucherzahl, der Umwelt und Infrastruktur stark belastet"],
    [600,"Welche wirtschaftlichen Vorteile hat Tourismus für Alpenregionen?","Einnahmen durch Übernachtungen, Gastronomie und Freizeit; Schaffung von Arbeitsplätzen"],
    [700,"Was ist Transitverkehr? Warum sind die Alpen besonders betroffen?","Durchgangsverkehr von Gütern und Personen; Alpen als Barriere zwischen Nord- und Südeuropa"],
    [800,"Umweltprobleme durch Transitverkehr in den Alpen?","Lärm, Luftverschmutzung, Erschütterungen, Flächenverbrauch durch Straßen/Tunnelbau"],
    [900,"Folgen des Klimawandels für die Alpengletscher?","Gletscher schmelzen; Wasservorräte sinken; Naturgefahren (Steinschlag, Muren) nehmen zu"],
    [1000,"Chancen und Risiken des Alpentourismus unter Nachhaltigkeitsaspekten.","Chancen: Einnahmen, Infrastruktur; Risiken: Übernutzung, Schäden; Lösung: nachhaltiger Tourismus"],
  ]},
  {n:"Süden Europas",q:[
    [100,"Wie heißt die Hauptstadt Italiens?","Rom"],
    [200,"Was ist ein Schichtvulkan?","Vulkan aus abwechselnden Lagen von Lava und Asche (z. B. Vesuv, Ätna)"],
    [300,"Nenne zwei aktive Vulkane in Südeuropa.","Ätna (Sizilien) und Vesuv (Kampanien) – auch: Stromboli"],
    [400,"Was ist Bewässerungsfeldbau?","Landwirtschaft mit künstlicher Wasserversorgung der Felder in trockenen Gebieten"],
    [500,"Was sind Sonderkulturen? Nenne zwei Beispiele.","Hochwertige Anbauprodukte: z. B. Oliven, Wein, Zitrusfrüchte"],
    [600,"Warum ist der Mittelmeerraum touristisch attraktiv?","Warmes Klima, Strände, Kultursehenswürdigkeiten, gute Erreichbarkeit"],
    [700,"Unterschied zwischen Trockenfeldbau und Bewässerungsfeldbau?","Trockenfeldbau = nur natürlicher Regen; Bewässerungsfeldbau = künstliche Wasserzufuhr"],
    [800,"Auswirkungen von Erdbeben auf Menschen in Südeuropa?","Zerstörung von Gebäuden/Infrastruktur, Todesopfer, wirtschaftliche Schäden, Tsunamigefahr"],
    [900,"Wie beeinflusst das mediterrane Klima die Landwirtschaft?","Heiße, trockene Sommer → Bewässerung nötig; milde, feuchte Winter → Winteranbau möglich"],
    [1000,"Umweltprobleme durch Massentourismus im Mittelmeerraum? Gegenmaßnahmen?","Wasserverbrauch, Küstenverbauung, Müll; Gegenmaßnahmen: Umweltauflagen, Schutzgebiete, nachhaltiger Tourismus"],
  ]},
];

const used=new Set(), sc=[0,0];
let act=null, showA=false, lastClosed=null;

function build(){
  const el=document.getElementById('board');
  let h='';
  for(let ci=0;ci<6;ci++) h+=`<div class="ch">${C[ci].n}</div>`;
  for(let qi=0;qi<10;qi++) for(let ci=0;ci<6;ci++){
    const k=`${ci}-${qi}`, u=used.has(k);
    h+=`<div class="qc${u?' used':''}"${!u?` data-c="${ci}" data-i="${qi}"`:''}>${u?'':C[ci].q[qi][0]}</div>`;
  }
  el.innerHTML=h;
  el.querySelectorAll('.qc:not(.used)').forEach(e=>{
    e.addEventListener('click',()=>open(+e.dataset.c,+e.dataset.i));
  });
}

function open(c,i){
  act={c,i}; showA=false;
  render();
  document.getElementById('ov').classList.add('on');
}

function render(){
  const q=C[act.c].q[act.i];
  document.getElementById('modal').innerHTML=`
    <div class="pts">${q[0]} Punkte</div>
    <div class="mcat">${C[act.c].n}</div>
    <div class="mqt">${q[1]}</div>
    ${showA?`<div class="mans">${q[2]}</div>`:''}
    <div class="brow">
      ${!showA
        ?`<button class="jb jbr" id="bR">&#128269; Lösung anzeigen</button>`
        :`<button class="jb jb1" id="bT1">&#10003; Team 1 &nbsp;+${q[0]}</button>
          <button class="jb jb2" id="bT2">&#10003; Team 2 &nbsp;+${q[0]}</button>`
      }
      <button class="jb jbs" id="bSk">&#10007; Kein Punkt</button>
    </div>`;
  if(!showA){
    document.getElementById('bR').onclick=()=>{showA=true;render();};
  } else {
    document.getElementById('bT1').onclick=()=>award(0);
    document.getElementById('bT2').onclick=()=>award(1);
  }
  document.getElementById('bSk').onclick=close;
}

function award(t){
  const pts=C[act.c].q[act.i][0];
  sc[t]+=pts;
  const card=document.getElementById(t?'c2':'c1');
  document.getElementById(t?'s2':'s1').textContent=sc[t];
  card.classList.remove('flash');
  void card.offsetWidth;
  card.classList.add('flash');
  lastClosed={c:act.c,i:act.i,team:t,pts};
  finClose();
}

function close(){
  if(act) lastClosed={c:act.c,i:act.i,team:null,pts:0};
  finClose();
}

function finClose(){
  if(act){used.add(`${act.c}-${act.i}`);act=null;}
  document.getElementById('ov').classList.remove('on');
  syncUndo();
  build();
}

function undo(){
  if(!lastClosed) return;
  const {c,i,team,pts}=lastClosed;
  used.delete(`${c}-${i}`);
  if(team!==null){
    sc[team]-=pts;
    document.getElementById(team?'s2':'s1').textContent=sc[team];
  }
  lastClosed=null;
  syncUndo();
  build();
  open(c,i);
}

function syncUndo(){
  const btn=document.getElementById('ubtn');
  if(!btn) return;
  btn.disabled=!lastClosed;
}

document.getElementById('ov').addEventListener('click',function(e){
  if(e.target===this) close();
});

document.getElementById('rbtn').addEventListener('click',()=>{
  used.clear(); sc[0]=sc[1]=0;
  document.getElementById('s1').textContent='0';
  document.getElementById('s2').textContent='0';
  act=null; showA=false; lastClosed=null;
  document.getElementById('ov').classList.remove('on');
  syncUndo();
  build();
});

document.getElementById('ubtn').addEventListener('click', undo);

build();
syncUndo();
</script>
</body>
</html>
