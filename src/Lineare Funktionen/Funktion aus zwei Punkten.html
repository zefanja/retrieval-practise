<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathe-Grid: Lineare Funktionen aus zwei Punkten</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['\\(', '\\)']] },
            chtml: { scale: 1.2 }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root {
            --bg-color: #F0DC82; /* Buff */
            --card-bg: #ffffff;
            --accent-color: #2c3e50;
            --timer-bg: #fff;
            --timer-alert: #e74c3c;
            --sol-color: #27ae60;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        header {
            height: 70px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            background: rgba(0,0,0,0.05);
            border-bottom: 3px solid var(--accent-color);
            box-sizing: border-box;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        h1 {
            font-size: 1.1rem;
            margin: 0;
            color: var(--accent-color);
            max-width: 250px;
            line-height: 1.1;
        }

        .timer-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #timer-display {
            font-family: 'Courier New', monospace;
            font-size: 2.2rem;
            font-weight: bold;
            background: var(--timer-bg);
            color: var(--accent-color);
            padding: 2px 15px;
            border-radius: 8px;
            border: 3px solid var(--accent-color);
            min-width: 120px;
            text-align: center;
        }

        .controls button {
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 6px;
            border: 2px solid var(--accent-color);
            background: white;
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--accent-color);
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .controls button:hover {
            background: #eee;
            transform: scale(1.05);
        }

        .back-btn {
            background: var(--accent-color) !important;
            color: white !important;
            font-size: 1.2rem !important;
        }

        main {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 10px;
            padding: 10px;
            box-sizing: border-box;
        }

        .task-card {
            background: var(--card-bg);
            border: 3px solid var(--accent-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .task-card:hover {
            background-color: #f9f9f9;
        }

        .task-num {
            position: absolute;
            top: 5px;
            left: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #2c3e50;
        }

        .question {
            font-size: clamp(0.9rem, 2.5vh, 1.8rem);
            color: var(--accent-color);
            margin-bottom: 5px;
            text-align: center;
            padding: 0 10px;
        }

        .show-sol .question {
            opacity: 0.15;
        }

        .solution {
            font-size: clamp(1rem, 3vh, 2.5rem);
            color: var(--sol-color);
            font-weight: bold;
            border-top: 2px dashed #ddd;
            width: 85%;
            text-align: center;
            padding-top: 5px;
            visibility: hidden;
            position: absolute;
            bottom: 15%;
        }

        .show-sol .solution {
            visibility: visible;
        }

        @media (max-width: 900px) {
            h1 { display: none; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <div class="controls">
            <button class="back-btn" onclick="history.back()" title="Zurück">←</button>
        </div>
        <h1>Lineare Funktionen: \(f(x)\) aus zwei Punkten</h1>
    </div>
    
    <div class="timer-container">
        <div class="controls">
            <button onclick="adjustTime(-60)">-1m</button>
        </div>
        <div id="timer-display">15:00</div>
        <div class="controls">
            <button onclick="adjustTime(60)">+1m</button>
            <button id="startStopBtn" onclick="toggleTimer()">▶ Start</button>
            <button onclick="resetTimer()">↻</button>
        </div>
    </div>

    <div class="controls">
        <button onclick="toggleAllSolutions()">👁 Lösungen</button>
        <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
    </div>
</header>

<main id="task-grid"></main>

<script>
    // 18 Tasks: Level 1 (A-F), Level 2 (G-L), Level 3 (M-R)
    const tasks = [
        // Level 1: Ganzzahlige positive Steigung, einfacher y-Achsenabschnitt
        { q: "P(0|1), Q(1|3)", a: "f(x) = 2x + 1" },
        { q: "P(0|2), Q(2|6)", a: "f(x) = 2x + 2" },
        { q: "P(1|4), Q(2|5)", a: "f(x) = x + 3" },
        { q: "P(0|0), Q(3|9)", a: "f(x) = 3x" },
        { q: "P(1|2), Q(3|10)", a: "f(x) = 4x - 2" },
        { q: "P(2|7), Q(4|11)", a: "f(x) = 2x + 3" },

        // Level 2: Negative Steigungen oder negative Koordinaten
        { q: "P(0|4), Q(2|0)", a: "f(x) = -2x + 4" },
        { q: "P(1|5), Q(3|1)", a: "f(x) = -2x + 7" },
        { q: "P(-1|2), Q(1|6)", a: "f(x) = 2x + 4" },
        { q: "P(-2|-3), Q(0|1)", a: "f(x) = 2x + 1" },
        { q: "P(2|1), Q(5|1)", a: "f(x) = 1" },
        { q: "P(1|-1), Q(4|-7)", a: "f(x) = -2x + 1" },

        // Level 3: Brüche als Steigung oder komplexere Werte
        { q: "P(0|2), Q(4|3)", a: "f(x) = \\frac{1}{4}x + 2" },
        { q: "P(1|1), Q(3|2)", a: "f(x) = 0,5x + 0,5" },
        { q: "P(-2|5), Q(2|3)", a: "f(x) = -0,5x + 4" },
        { q: "P(1|2), Q(4|3)", a: "f(x) = \\frac{1}{3}x + \\frac{5}{3}" },
        { q: "P(-3|4), Q(3|0)", a: "f(x) = -\\frac{2}{3}x + 2" },
        { q: "P(2|5), Q(5|2)", a: "f(x) = -x + 7" }
    ];

    let timeLeft = 900; 
    let timerInterval = null;

    function initGrid() {
        const grid = document.getElementById('task-grid');
        grid.innerHTML = '';
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        
        tasks.forEach((task, index) => {
            const card = document.createElement('div');
            card.className = 'task-card';
            const label = alphabet[index] || (index + 1);
            
            card.innerHTML = `
                <div class="task-num">${label}</div>
                <div class="question">Gegeben:<br>\\(${task.q}\\)</div>
                <div class="solution">\\(${task.a}\\)</div>
            `;
            
            card.onclick = () => card.classList.toggle('show-sol');
            grid.appendChild(card);
        });

        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    }

    function updateTimerDisplay() {
        const min = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const sec = (timeLeft % 60).toString().padStart(2, '0');
        const display = document.getElementById('timer-display');
        display.innerText = `${min}:${sec}`;
        
        if (timeLeft === 0) {
            display.style.backgroundColor = 'var(--timer-alert)';
            display.style.color = 'white';
        } else {
            display.style.backgroundColor = 'var(--timer-bg)';
            display.style.color = 'var(--accent-color)';
        }
    }

    function toggleTimer() {
        const btn = document.getElementById('startStopBtn');
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
            btn.innerText = "▶ Start";
        } else {
            if (timeLeft <= 0) return;
            btn.innerText = "Ⅱ Pause";
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                }
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    btn.innerText = "▶ Start";
                }
            }, 1000);
        }
    }

    function resetTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
            document.getElementById('startStopBtn').innerText = "▶ Start";
        }
        timeLeft = 900;
        updateTimerDisplay();
    }

    function adjustTime(amount) {
        timeLeft = Math.max(0, timeLeft + amount);
        updateTimerDisplay();
    }

    function toggleAllSolutions() {
        const cards = document.querySelectorAll('.task-card');
        const anyVisible = Array.from(cards).some(c => c.classList.contains('show-sol'));
        cards.forEach(c => {
            if (anyVisible) c.classList.remove('show-sol');
            else c.classList.add('show-sol');
        });
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.error(`Fehler beim Vollbild-Wechsel: ${err.message}`);
            });
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
        }
    }

    window.onload = () => {
        initGrid();
        updateTimerDisplay();
    };
</script>

</body>
</html>
