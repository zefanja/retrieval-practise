<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Info-Jeopardy · Klasse 7</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --navy:#0a1628;
  --cell:#1a3a6b;
  --cell-h:#1d4595;
  --cell-u:#0c1622;
  --cat:#0e50b0;
  --cat-b:#4a9fe8;
  --gold:#ffd700;
  --modal:#071426;
}

html,body{height:100%;background:var(--navy);color:#fff;font-family:'Oswald',sans-serif;overflow:hidden}

#app{height:100vh;display:flex;flex-direction:column;padding:10px;gap:8px}

/* ── SCOREBAR ── */
#bar{display:flex;gap:10px;height:72px;flex-shrink:0}

.sc{flex:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sl{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:3px}
.sp{font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--gold);line-height:1}

#mid{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:160px;gap:4px}
#gtitle{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--gold);letter-spacing:5px;text-shadow:0 0 18px rgba(255,215,0,.35)}
#gsub{font-size:11px;color:#90caf9;letter-spacing:2px;text-transform:uppercase}
#rbtn{margin-top:3px;background:transparent;border:1px solid #2a5298;color:#90caf9;padding:3px 12px;font-size:11px;border-radius:4px;cursor:pointer;font-family:'Oswald',sans-serif;letter-spacing:1px;transition:background .15s,color .15s}
#rbtn:hover{background:#1a3a6b;color:var(--gold)}
#ubtn{background:transparent;border:1px solid #2a5298;color:#90caf9;padding:3px 12px;font-size:11px;border-radius:4px;font-family:'Oswald',sans-serif;letter-spacing:1px;transition:background .15s,color .15s,opacity .2s;opacity:.32;cursor:default}
#ubtn:not([disabled]){opacity:1;cursor:pointer}
#ubtn:not([disabled]):hover{background:#1a3a6b;color:var(--gold)}

/* ── BOARD ── */
#board{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:56px repeat(5,1fr);
  gap:5px;
  flex:1;
  min-height:0;
}

.ch{
  background:var(--cat);border:2px solid var(--cat-b);border-radius:6px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:'Oswald',sans-serif;font-weight:600;font-size:11.5px;
  letter-spacing:.5px;text-transform:uppercase;line-height:1.3;
  padding:3px 5px;color:#fff;
}

.qc{
  background:var(--cell);border:2px solid #2a5298;color:var(--gold);
  border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:clamp(20px,3.2vw,40px);
  letter-spacing:1px;cursor:pointer;user-select:none;
  transition:background .12s,transform .1s,box-shadow .12s;
}
.qc:hover{background:var(--cell-h);transform:scale(1.04);box-shadow:0 0 14px rgba(255,215,0,.22)}
.qc.used{background:var(--cell-u);border-color:#111d2a;color:transparent;cursor:default;pointer-events:none;transform:none!important;box-shadow:none!important}

/* ── OVERLAY ── */
#ov{
  position:fixed;inset:0;background:rgba(0,0,0,.9);
  display:none;align-items:center;justify-content:center;
  z-index:200;padding:20px;backdrop-filter:blur(3px);
}
#ov.on{display:flex;animation:fIn .2s ease}
@keyframes fIn{from{opacity:0}to{opacity:1}}

#modal{
  background:var(--modal);border:2px solid var(--gold);border-radius:14px;
  padding:32px 36px;max-width:720px;width:100%;text-align:center;
  animation:sUp .22s ease;
  box-shadow:0 0 50px rgba(255,215,0,.12);
}
@keyframes sUp{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}

.pts{
  background:var(--gold);color:#071426;font-family:'Bebas Neue',sans-serif;
  font-size:22px;letter-spacing:3px;border-radius:6px;
  display:inline-block;padding:4px 22px;margin-bottom:10px;
}
.mcat{font-size:11px;color:#90caf9;letter-spacing:2px;text-transform:uppercase;margin-bottom:18px}
.mqt{font-family:'Playfair Display',serif;font-size:22px;line-height:1.65;color:#fff;margin-bottom:26px}
.mans{
  background:#071f10;border:1px solid #43a047;border-radius:8px;
  padding:16px 20px;margin-bottom:24px;
  font-family:'Playfair Display',serif;font-size:17px;
  color:#a5d6a7;line-height:1.6;text-align:left;
  animation:fIn .3s ease;
}
.brow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.jb{
  border:none;cursor:pointer;font-family:'Oswald',sans-serif;
  font-weight:500;font-size:15px;letter-spacing:1px;
  border-radius:8px;padding:12px 22px;
  transition:opacity .12s,transform .1s;
}
.jb:hover{opacity:.84;transform:scale(1.04)}
.jb:active{transform:scale(.97)}
.jbr{background:#1055b5;color:#fff}
.jb1{background:#8b1010;color:#fff}
.jb2{background:#125212;color:#fff}
.jbs{background:#253545;color:#90a4ae}

/* score flash */
@keyframes ptFlash{0%,100%{transform:scale(1)}40%{transform:scale(1.25)}}
.flash .sp{animation:ptFlash .4s ease}
</style>
</head>
<body>

<div id="app">
  <div id="bar">
    <div class="sc" id="c1" style="background:#3a0000;border:2px solid #e53935">
      <span class="sl" style="color:#ffcdd2">Team 1</span>
      <span class="sp" id="s1">0</span>
    </div>
    <div id="mid">
      <div id="gtitle">Info-Jeopardy</div>
      <div id="gsub">Informatik · Klasse 7</div>
      <button id="rbtn">↺ Neu starten</button>
      <button id="ubtn" disabled>↩ Rückgängig</button>
    </div>
    <div class="sc" id="c2" style="background:#002500;border:2px solid #43a047">
      <span class="sl" style="color:#c8e6c9">Team 2</span>
      <span class="sp" id="s2">0</span>
    </div>
  </div>
  <div id="board"></div>
</div>

<div id="ov"><div id="modal"></div></div>

<script>
const C=[
  {n:"Information & Daten",q:[
    [100,"Was ist der Unterschied zwischen \u201eInformation\u201c und \u201eDaten\u201c?","Daten sind die maschinell verarbeitbare Darstellung (Zeichen, Zahlen); Information ist die Bedeutung, die ein Mensch den Daten entnimmt."],
    [200,"Nenne drei Darstellungsformen, in denen Informationen vorliegen k\u00f6nnen.","z. B. Text, Tabelle, Grafik, Audio, Video (drei davon)"],
    [300,"Womit besch\u00e4ftigt sich die Wissenschaft Informatik?","Mit der systematischen Darstellung, Speicherung, Verarbeitung und \u00dcbertragung von Daten/Informationen \u2013 Informatik als Strukturwissenschaft."],
    [400,"Aus einem Foto wird eine Bilddatei. Sind das Daten oder Information? Begr\u00fcnde kurz.","Die gespeicherte Datei besteht aus Daten; die Information entsteht erst, wenn ein Mensch das Bild betrachtet und ihm Bedeutung gibt."],
    [500,"Warum muss man Informationen erst in Daten umwandeln, damit ein Computer sie verarbeiten kann?","Ein Computer arbeitet nur mit codierten, letztlich bin\u00e4ren Werten; Informationen m\u00fcssen daher in eine maschinell verarbeitbare Datenform gebracht werden."],
  ]},
  {n:"Bin\u00e4rsystem & Gr\u00f6\u00dfen",q:[
    [100,"Welche zwei Ziffern verwendet das Bin\u00e4rsystem (Dualsystem)?","0 und 1"],
    [200,"Wie viele Bit ergeben ein Byte?","8 Bit"],
    [300,"Wandle die Bin\u00e4rzahl 1011 in eine Dezimalzahl um.","11 (8 + 0 + 2 + 1)"],
    [400,"Unterschied zwischen einem SI-Pr\u00e4fix (z. B. Kilo) und einem Bin\u00e4rpr\u00e4fix (z. B. Kibi) bei Speichergr\u00f6\u00dfen?","SI: 1 Kilobyte = 1000 Byte (Zehnerpotenz); Bin\u00e4r: 1 Kibibyte = 1024 Byte (2\u00b9\u2070)."],
    [500,"Ordne vom kleinsten zum gr\u00f6\u00dften Pr\u00e4fix: Mega, Tera, Kilo, Giga.","Kilo < Mega < Giga < Tera"],
  ]},
  {n:"Digitale Medien & Software",q:[
    [100,"Welche Art von Software nutzt du, um Berechnungen in Tabellen zu automatisieren?","Tabellenkalkulation"],
    [200,"Unterschied zwischen einer Pixelgrafik und einer Vektorgrafik?","Pixelgrafik besteht aus einzelnen Bildpunkten (verpixelt beim Vergr\u00f6\u00dfern); Vektorgrafik beschreibt Formen mathematisch und bleibt beim Skalieren scharf."],
    [300,"Was bedeutet \u201eTrennung von Inhalt und Design\u201c, z. B. bei einer Pr\u00e4sentation?","Der Inhalt (Text, Daten) wird getrennt von der Gestaltung (Layout, Farben, Schrift) festgelegt \u2013 z. B. \u00fcber Vorlagen/Formatvorlagen."],
    [400,"Objektorientierung: Was ist eine \u201eKlasse\u201c und was ist ein \u201eObjekt\u201c?","Eine Klasse ist die allgemeine Bauvorlage; ein Objekt ist ein konkretes Exemplar dieser Klasse."],
    [500,"Ein Objekt \u201eAuto\u201c ist rot und kann hupen. Was davon ist ein Attribut, was eine Methode?","\u201eFarbe = Rot\u201c ist ein Attribut (Eigenschaft); \u201ehupen\u201c ist eine Methode (Verhalten/Operation)."],
  ]},
  {n:"Hardware & Informatiksysteme",q:[
    [100,"Nenne zwei Eingabeger\u00e4te eines Computers.","z. B. Tastatur und Maus (auch: Mikrofon, Scanner, Kamera)"],
    [200,"Welches Bauteil ist f\u00fcr das Verarbeiten/Rechnen zust\u00e4ndig?","Der Prozessor (CPU)"],
    [300,"Wozu dient der Arbeitsspeicher (RAM)?","Er speichert gerade ben\u00f6tigte Daten und Programme kurzfristig; sein Inhalt geht beim Ausschalten verloren."],
    [400,"Ein Touchscreen ist Eingabe- und Ausgabeger\u00e4t zugleich. Erkl\u00e4re warum.","Er zeigt Inhalte an (Ausgabe) und nimmt zugleich Ber\u00fchrungen als Eingabe entgegen."],
    [500,"Nenne drei verschiedene Arten von Informatiksystemen.","z. B. Personalcomputer, mobiles Endger\u00e4t (Smartphone/Tablet) und Einplatinenrechner (z. B. Raspberry Pi)."],
  ]},
  {n:"EVA-Modell & Betriebssystem",q:[
    [100,"Wof\u00fcr stehen die drei Buchstaben im EVA-Modell?","Eingabe \u2013 Verarbeitung \u2013 Ausgabe"],
    [200,"Welcher Schritt kommt hinzu, wenn man das EVA-Modell zum EVAS-Modell erweitert?","Das Speichern"],
    [300,"Nenne zwei Aufgaben eines Betriebssystems.","z. B. Verwaltung der Hardware/Ger\u00e4te, Verwaltung von Speicher und Dateien, Bereitstellung einer Benutzeroberfl\u00e4che, Starten/Verwalten von Programmen (zwei davon)."],
    [400,"Ordne dem EVA-Modell beim Taschenrechner je ein Beispiel zu (Eingabe, Verarbeitung, Ausgabe).","Eingabe: Zahlen/Tasten dr\u00fccken; Verarbeitung: Rechnen; Ausgabe: Ergebnis auf dem Display."],
    [500,"Warum kann man eine Datei mit der Endung \u201e.mp3\u201c nicht sinnvoll in einem Textverarbeitungsprogramm \u00f6ffnen?","Der Dateityp (Audio) passt nicht zur Applikation; jedes Programm verarbeitet nur bestimmte Formate \u2013 Dateityp und Anwendung m\u00fcssen zusammenpassen."],
  ]},
  {n:"Algorithmen",q:[
    [100,"Was ist ein Algorithmus?","Eine eindeutige, schrittweise Handlungsvorschrift, die ein Problem in endlich vielen Schritten l\u00f6st."],
    [200,"Nenne ein Beispiel f\u00fcr einen Algorithmus aus dem Alltag.","z. B. ein Kochrezept, eine Bastelanleitung oder eine Wegbeschreibung (jede eindeutige Schritt-f\u00fcr-Schritt-Anleitung)."],
    [300,"Was versteht man unter der \u201everbalen Beschreibung\u201c eines Algorithmus?","Die einzelnen Schritte werden in normaler (Umgangs-)Sprache, Schritt f\u00fcr Schritt, formuliert."],
    [400,"Was ist eine Blocksprache (visuelle Programmierumgebung)? Nenne ein Beispiel.","Eine Umgebung, in der man Programme aus vorgefertigten Befehlsbausteinen zusammensetzt, statt Code zu tippen \u2013 z. B. Scratch."],
    [500,"Warum muss jeder Schritt eines Algorithmus eindeutig sein?","Damit er ohne Interpretationsspielraum immer gleich ausgef\u00fchrt wird und stets zum gleichen Ergebnis f\u00fchrt."],
  ]},
];

const ROWS=5;
const used=new Set(), sc=[0,0];
let act=null, showA=false, lastClosed=null;

function build(){
  const el=document.getElementById('board');
  let h='';
  for(let ci=0;ci<6;ci++) h+=`<div class="ch">${C[ci].n}</div>`;
  for(let qi=0;qi<ROWS;qi++) for(let ci=0;ci<6;ci++){
    const k=`${ci}-${qi}`, u=used.has(k);
    h+=`<div class="qc${u?' used':''}"${!u?` data-c="${ci}" data-i="${qi}"`:''}>${u?'':C[ci].q[qi][0]}</div>`;
  }
  el.innerHTML=h;
  el.querySelectorAll('.qc:not(.used)').forEach(e=>{
    e.addEventListener('click',()=>open(+e.dataset.c,+e.dataset.i));
  });
}

function open(c,i){
  act={c,i}; showA=false;
  render();
  document.getElementById('ov').classList.add('on');
}

function render(){
  const q=C[act.c].q[act.i];
  document.getElementById('modal').innerHTML=`
    <div class="pts">${q[0]} Punkte</div>
    <div class="mcat">${C[act.c].n}</div>
    <div class="mqt">${q[1]}</div>
    ${showA?`<div class="mans">${q[2]}</div>`:''}
    <div class="brow">
      ${!showA
        ?`<button class="jb jbr" id="bR">&#128269; L\u00f6sung anzeigen</button>`
        :`<button class="jb jb1" id="bT1">&#10003; Team 1 &nbsp;+${q[0]}</button>
          <button class="jb jb2" id="bT2">&#10003; Team 2 &nbsp;+${q[0]}</button>`
      }
      <button class="jb jbs" id="bSk">&#10007; Kein Punkt</button>
    </div>`;
  if(!showA){
    document.getElementById('bR').onclick=()=>{showA=true;render();};
  } else {
    document.getElementById('bT1').onclick=()=>award(0);
    document.getElementById('bT2').onclick=()=>award(1);
  }
  document.getElementById('bSk').onclick=close;
}

function award(t){
  const pts=C[act.c].q[act.i][0];
  sc[t]+=pts;
  const card=document.getElementById(t?'c2':'c1');
  document.getElementById(t?'s2':'s1').textContent=sc[t];
  card.classList.remove('flash');
  void card.offsetWidth;
  card.classList.add('flash');
  lastClosed={c:act.c,i:act.i,team:t,pts};
  finClose();
}

function close(){
  if(act) lastClosed={c:act.c,i:act.i,team:null,pts:0};
  finClose();
}

function finClose(){
  if(act){used.add(`${act.c}-${act.i}`);act=null;}
  document.getElementById('ov').classList.remove('on');
  syncUndo();
  build();
}

function undo(){
  if(!lastClosed) return;
  const {c,i,team,pts}=lastClosed;
  used.delete(`${c}-${i}`);
  if(team!==null){
    sc[team]-=pts;
    document.getElementById(team?'s2':'s1').textContent=sc[team];
  }
  lastClosed=null;
  syncUndo();
  build();
  open(c,i);
}

function syncUndo(){
  const btn=document.getElementById('ubtn');
  if(!btn) return;
  btn.disabled=!lastClosed;
}

document.getElementById('ov').addEventListener('click',function(e){
  if(e.target===this) close();
});

document.getElementById('rbtn').addEventListener('click',()=>{
  used.clear(); sc[0]=sc[1]=0;
  document.getElementById('s1').textContent='0';
  document.getElementById('s2').textContent='0';
  act=null; showA=false; lastClosed=null;
  document.getElementById('ov').classList.remove('on');
  syncUndo();
  build();
});

document.getElementById('ubtn').addEventListener('click', undo);

build();
syncUndo();
</script>
</body>
</html>
